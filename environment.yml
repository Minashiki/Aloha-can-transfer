# Recreate with: conda env create -f environment.yml
# Then, from this repository: conda run -n AIControl python -m pip install -e .
# torch is the CUDA 13.2 wheel (2.15.0+cu132). Do not install it from the default CPU index.
name: AIControl
channels:
  - defaults
dependencies:
  - python=3.12.14
  - pip
  - setuptools=83.0.0
  - wheel=0.47.0
  - packaging=26.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.15.0+cu132
      - triton==3.9.0
      - cuda-toolkit==13.2.2
      - cuda-bindings==13.4.4
      - cuda-pathfinder==1.8.4
      - nvidia-cublas==13.4.1.3
      - nvidia-cuda-cccl==13.3.4.3.1
      - nvidia-cuda-cupti==13.2.86
      - nvidia-cuda-nvrtc==13.2.86
      - nvidia-cuda-runtime==13.2.86
      - nvidia-cudnn-cu13==9.26.0.51
      - nvidia-cufft==12.2.0.57
      - nvidia-cufile==1.17.1.22
      - nvidia-cusolver==12.2.0.11
      - nvidia-cusparse==12.7.10.12
      - nvidia-cusparselt-cu13==0.8.1
      - nvidia-nccl-cu13==2.30.7
      - nvidia-nvjitlink==13.4.92
      - nvidia-nvshmem-cu13==3.7.2
      - nvidia-nvtx==13.2.86
      - filelock==4.2.4
      - fsspec==2026.9.0
      - jinja2==3.1.6
      - markupsafe==3.0.3
      - mpmath==1.3.0
      - networkx==3.7
      - sympy==1.14.0
      - typing_extensions==4.16.0
